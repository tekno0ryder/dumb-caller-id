# Lints, tests and builds every push to main and every pull request. The release build is unsigned here
# (signing secrets are only used by release.yml), but it still runs R8 code shrinking, which can break things
# the debug build doesn't.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also checks that gradle-wrapper.jar is the genuine one.
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, test and build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
